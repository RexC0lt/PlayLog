# PlayLog — single-container deployment for an OpenMediaVault home server.
# Reachable only inside your tailnet: bind the published port to the Tailscale
# IP of the OMV host (see README "Tailscale"), or keep it on the LAN and use
# Tailscale ACLs / Serve to expose it.
services:
  playlog:
    build: .
    container_name: playlog
    restart: unless-stopped
    ports:
      # exactly one exposed port; host port configurable via PORT in .env
      - "${PORT:-8787}:${PORT:-8787}"
    env_file:
      # optional on fresh clones; copy .env.example to .env to configure
      - path: .env
        required: false
    environment:
      PORT: "${PORT:-8787}"
      DATA_DIR: /data
    volumes:
      # SQLite database + cover cache live here so OMV backup jobs cover them
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os,sys; sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{os.environ.get(\"PORT\",\"8787\")}/api/auth/me', timeout=3).status in (200,401) else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
